<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-label="Middle third" font-family="-apple-system,Helvetica,Arial,sans-serif">
<rect x="20" y="20" width="600" height="260" rx="22" fill="#111"/>
<rect x="20" y="20" width="200" height="260" rx="22" fill="#1d3557" opacity=".9"/><rect x="200" y="20" width="20" height="260" fill="#1d3557" opacity=".9"/>
<rect x="220" y="20" width="200" height="260" fill="#6b4e16"/>
<rect x="420" y="20" width="200" height="260" rx="22" fill="#1d3557" opacity=".9"/><rect x="420" y="20" width="20" height="260" fill="#1d3557" opacity=".9"/>
<line x1="220" y1="20" x2="220" y2="280" stroke="#fff" stroke-dasharray="6 6" opacity=".6"/><line x1="420" y1="20" x2="420" y2="280" stroke="#fff" stroke-dasharray="6 6" opacity=".6"/>
<g fill="#fff" text-anchor="middle"><text x="120" y="70" font-size="20" font-weight="700">Left third</text><text x="120" y="120" font-size="16">Tap: controls</text><text x="120" y="148" font-size="16">Double: back 10 s</text>
<text x="320" y="70" font-size="20" font-weight="700">Middle third</text><text x="320" y="120" font-size="16">Tap: play / pause</text><text x="320" y="148" font-size="16">Hold: 2× speed</text><text x="320" y="172" font-size="13" opacity=".8">(hold works anywhere)</text>
<text x="520" y="70" font-size="20" font-weight="700">Right third</text><text x="520" y="120" font-size="16">Tap: controls</text><text x="520" y="148" font-size="16">Double: fwd 10 s</text></g>
<g stroke="#ffb703" stroke-width="5" fill="none" stroke-linecap="round"><line x1="320" y1="195" x2="320" y2="255"/><polyline points="302,238 320,258 338,238"/></g>
<text x="320" y="318" font-size="17" text-anchor="middle" fill="#ffb703" font-weight="700">↓ Swipe down to close (at 1×)</text>
<g stroke="#8ecae6" stroke-width="3" fill="none" stroke-linecap="round"><line x1="40" y1="372" x2="62" y2="350"/><polyline points="50,350 62,350 62,362"/><line x1="40" y1="372" x2="18" y2="394"/><polyline points="30,394 18,394 18,382"/></g><text x="320" y="358" font-size="17" text-anchor="middle" fill="#8ecae6" font-weight="700">Pinch with two fingers: zoom (up to 4×)</text><text x="320" y="388" font-size="15" text-anchor="middle" fill="#8ecae6">While zoomed, drag to move · two-finger double-tap for 1×</text>
</svg>