site_name: Sparklux
site_description: SDR の映像を、実時間で HDR に。Mac と iPhone / iPad の動画プレイヤー
site_url: https://monmac1111.github.io/sparklux-help/
repo_url: https://github.com/monmac1111/sparklux-help
theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle: { icon: material/weather-night, name: ダークモードへ }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle: { icon: material/weather-sunny, name: ライトモードへ }
  features: [navigation.sections, navigation.top, content.code.copy]
nav:
  - Sparklux: index.md
  - 日本語:
      - ヘルプ（Mac）: ja/help.md
      - プライバシーポリシー（Mac）: ja/privacy.md
      - ヘルプ（iPhone / iPad）: ja/ios/help.md
      - プライバシーポリシー（iPhone / iPad）: ja/ios/privacy.md
  - English:
      - Help (Mac): en/help.md
      - Privacy Policy (Mac): en/privacy.md
      - Help (iPhone / iPad): en/ios/help.md
      - Privacy Policy (iPhone / iPad): en/ios/privacy.md
markdown_extensions: [admonition, tables, attr_list]
